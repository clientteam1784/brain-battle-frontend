<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — Code ML</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html"><span class="logo-mark"></span>Code ML</a>
    <nav class="nav-links">
      <a href="curriculum.html">커리큘럼</a>
      <a href="learn.html">문제풀기</a>
      <a href="mypage.html">마이페이지</a>
    </nav>
    <div class="nav-actions">
      <a class="btn btn-outline" href="login.html">로그인</a>
      <a class="btn btn-primary" href="signup.html">시작하기</a>
    </div>
  </header>

  <main>
    <div class="auth-body">
      <form class="auth-card" id="authForm" novalidate>
        <div class="col gap-8">
          <h1 class="h2">다시 오신 걸 환영해요</h1>
          <p class="muted">이메일과 비밀번호로 로그인하고 학습을 이어가세요.</p>
        </div>
        <div class="col gap-16">
          <div class="field">
            <label for="email">이메일</label>
            <input class="input" id="email" name="email" type="email" placeholder="example@school.kr" autocomplete="email" required>
            <span class="field-error" data-for="email">올바른 이메일을 입력해 주세요.</span>
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input class="input" id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
            <span class="field-error" data-for="password">비밀번호를 입력해 주세요.</span>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
        <p class="small muted row center gap-8">아직 계정이 없나요? <a class="strong" style="color:var(--text-primary)" href="signup.html">회원가입</a></p>
      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
