<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>방 만들기</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/host-create.css" />
</head>
<body data-back="role.html">
  <main class="page" style="padding-top: 127px">
    <div class="card box">
      <div class="running" id="running" hidden>
        <p id="runningText"></p>
        <div class="tools">
          <button class="btn sub-btn small" id="resume" type="button">돌아가기</button>
          <button class="btn red small" id="drop" type="button">끝내기</button>
        </div>
      </div>
      <h1 class="title big">방 만들기</h1>

      <div class="group">
        <p class="label">방 이름</p>
        <input id="roomName" placeholder="예: 3학년 1반 수학 퀴즈" autocomplete="off" />
      </div>

      <div class="group">
        <p class="label">최대 인원</p>
        <div class="stepper">
          <button class="step" id="minus" type="button">−</button>
          <p class="num" id="max">24</p>
          <button class="step" id="plus" type="button">+</button>
          <p class="sub small" id="maxNote">최대 24명까지 입장할 수 있어요</p>
        </div>
      </div>

      <div class="group">
        <div class="head">
          <p class="label" id="count">문제 (0개 등록됨)</p>
          <button class="btn sub-btn small" id="add" type="button">+ 문제 추가</button>
        </div>
        <div id="list" class="list"></div>
      </div>

      <p class="error" id="error"></p>
      <button class="btn full" id="make" type="button">방 만들기</button>
    </div>
  </main>

  <!-- 03 문제 추가 -->
  <dialog id="dialog">
    <div class="bar">
      <p id="dialogTitle">문제 추가</p>
      <button id="close" type="button" aria-label="닫기">×</button>
    </div>
    <div class="body">
      <div class="group">
        <p class="label">문제 번호</p>
        <input id="number" class="num-input" type="number" min="1" />
      </div>
      <div class="group">
        <p class="label">정답</p>
        <div id="padSlot"></div>
        <input id="answer" class="answer-input" placeholder="정답을 입력하세요 (예: π/2, x², √3)" autocomplete="off" />
        <p class="hint">π, 제곱(^2), 루트(√) 같은 기호는 위 수식 도구로 입력할 수 있어요</p>
      </div>
      <p class="error" id="dialogError"></p>
      <div class="footer">
        <button class="btn sub-btn foot" id="cancel" type="button">취소</button>
        <button class="btn sub-btn foot" id="more" type="button">+ 하나 더</button>
        <button class="btn foot" id="saveBtn" type="button">저장</button>
      </div>
    </div>
  </dialog>

  <script src="js/common.js"></script>
  <script src="js/host-create.js?v=4"></script>
</body>
</html>
